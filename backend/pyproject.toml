[project]
name = "niftypilot"
version = "0.3.0"
description = "Research-first algorithmic trading platform for NSE cash equity (paper mode only)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pandas>=2.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends() and read-only pydantic config defaults are idiomatic here
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # generated
